<svg xmlns="http://www.w3.org/2000/svg"
     width="48"
     height="48"
     viewBox="0 0 160 160">

  <!-- Black half (clockwise: top-mid → bottom-mid) -->
  <path
    d="M80 28.04 L110 28.04 L140 80 L110 131.96 L80 131.96"
    fill="none"
    stroke="#000000"
    stroke-width="10"
    stroke-dasharray="20 16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Red half (counter-clockwise) -->
  <path
    d="M80 131.96 L50 131.96 L20 80 L50 28.04 L80 28.04"
    fill="none"
    stroke="#C62828"
    stroke-width="10"
    stroke-dasharray="20 16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- + -->
  <path
    d="M64 66 L64 94 M46 80 L82 80"
    stroke="#24323A"
    stroke-width="10"
    stroke-linecap="round"
  />

  <!-- 1 -->
  <path
    d="M100 58 L100 102"
    stroke="#24323A"
    stroke-width="10"
    stroke-linecap="round"
  />
     <!-- More vertical NOT slash -->
  <line
    x1="130"  y1="30"
    x2="30" y2="130"
    stroke="#C62828"
    stroke-width="10"
    stroke-linecap="round"
  />
</svg>