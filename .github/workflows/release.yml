name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check src/cryptid tests tools

      - name: Run tests
        run: python -m pytest tests/unit tests/integration -v --tb=short

      - name: Smoke import app entry
        env:
          PYTHONPATH: src/cryptid
          QT_QPA_PLATFORM: offscreen
        run: python -c "from ui.shared.custom_map_save import ensure_custom_maps_json; ensure_custom_maps_json(); import app"

  build-windows:
    name: Build Windows executable
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Pre-generate map thumbnails
        run: python tools/generate_map_thumbnails.py --force

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean CryptidCompanion.spec

      - name: Zip release folder
        run: Compress-Archive -Path dist/CryptidCompanion -DestinationPath dist/CryptidCompanion-win.zip -Force

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CryptidCompanion-win.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
